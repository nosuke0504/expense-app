<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>青藍会 決算報告用レシート管理アプリ</title>
    <style>
        body { font-family: sans-serif; padding: 15px; background-color: #f8f9fa; color: #333; margin: 0; }
        .container { max-width: 1200px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h2 { border-bottom: 2px solid #0066cc; padding-bottom: 8px; color: #0066cc; margin-top: 0; }
        
        /* タブナビゲーション */
        .tab-nav { display: flex; gap: 5px; margin-bottom: 20px; border-bottom: 2px solid #0066cc; }
        .tab-btn { padding: 10px 18px; border: none; background-color: #e9ecef; cursor: pointer; font-size: 15px; font-weight: bold; border-radius: 6px 6px 0 0; color: #495057; }
        .tab-btn.active { background-color: #0066cc; color: white; }

        /* カメラ表示エリア */
        .camera-section { padding: 15px; background: #111; color: #fff; border-radius: 8px; text-align: center; position: relative; }
        .video-wrapper { position: relative; width: 100%; max-width: 480px; margin: 0 auto; overflow: hidden; border-radius: 8px; background: #000; }
        video { width: 100%; height: auto; display: block; }
        
        .guide-box {
            position: absolute; top: 10%; left: 10%; width: 80%; height: 80%;
            border: 2px dashed #00ffcc; border-radius: 8px; box-sizing: border-box;
            pointer-events: none; display: flex; align-items: center; justify-content: center;
        }
        .guide-text { color: #00ffcc; background: rgba(0,0,0,0.6); padding: 4px 8px; border-radius: 4px; font-size: 12px; }

        .controls { margin-top: 12px; }
        button { background-color: #0066cc; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: bold; }
        button:disabled { background-color: #777; cursor: not-allowed; }
        button.btn-success { background-color: #28a745; }
        button.btn-success:hover { background-color: #218838; }
        button.btn-danger { background-color: #dc3545; }
        button.btn-secondary { background-color: #6c757d; }
        
        #status { margin-top: 10px; font-weight: bold; color: #00ffcc; min-height: 24px; }

        /* Excel風 縦軸固定テーブルレイアウト */
        .table-responsive {
            overflow-x: auto;
            margin-top: 15px;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            background: #fff;
        }
        .excel-vertical-table {
            border-collapse: collapse;
            width: max-content;
            min-width: 100%;
        }
        .excel-vertical-table th, .excel-vertical-table td {
            border: 1px solid #d0d7de;
            padding: 8px 12px;
            font-size: 13px;
            vertical-align: middle;
        }
        .excel-vertical-table th.sticky-header {
            position: sticky;
            left: 0;
            background-color: #f0f4f8;
            z-index: 2;
            min-width: 180px;
            box-shadow: 2px 0 5px rgba(0,0,0,0.05);
            font-weight: bold;
            color: #333;
            text-align: left;
        }

        input[type="text"], input[type="number"], select { width: 100%; box-sizing: border-box; padding: 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
        .warning-tag { display: block; background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; padding: 4px 6px; border-radius: 4px; margin-bottom: 4px; font-size: 12px; }
        
        /* 決算報告まとめ計算ボックス */
        .summary-box { margin-top: 20px; padding: 15px; background: #eef6ff; border-radius: 6px; border: 1px solid #cce0ff; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 15px; }
        .summary-inputs { display: flex; align-items: center; gap: 10px; font-weight: bold; }
        .summary-inputs input { width: 140px; font-size: 16px; padding: 4px 8px; }
        .summary-results { font-size: 16px; font-weight: bold; text-align: right; }
        .refund-text { color: #dc3545; font-size: 18px; }

        .action-bar { margin-top: 15px; display: flex; gap: 10px; justify-content: flex-end; }

        /* 手動入力フォーム */
        .manual-form-group { margin-bottom: 15px; }
        .manual-form-group label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }

        /* A4印刷用レイアウト設定 */
        @media print {
            body * { visibility: hidden; }
            #printArea, #printArea * { visibility: visible; }
            #printArea { position: absolute; left: 0; top: 0; width: 100%; }
            .a4-sheet { page-break-after: always; width: 210mm; height: 280mm; padding: 15mm; box-sizing: border-box; border: 2px solid #333; margin-bottom: 20px; }
            .a4-header { font-size: 20px; font-weight: bold; border-bottom: 2px solid #000; padding-bottom: 5px; margin-bottom: 15px; display: flex; justify-content: space-between; }
            .a4-body { text-align: center; margin-top: 20px; }
            .a4-img { max-width: 100%; max-height: 180mm; border: 1px solid #999; }
            .a4-details { margin-top: 15px; text-align: left; font-size: 14px; line-height: 1.6; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>青藍会 決算報告用レシート管理</h2>
        
        <!-- タブナビゲーション -->
        <div class="tab-nav">
            <button class="tab-btn active" id="btnTabCamera" onclick="switchTab('camera')">📷 カメラ読み取り</button>
            <button class="tab-btn" id="btnTabList" onclick="switchTab('list')">📋 支出一覧（決算報告用）</button>
            <button class="tab-btn" id="btnTabManual" onclick="switchTab('manual')">✍️ 手動入力</button>
        </div>

        <!-- 1. カメラ読み取りビュー -->
        <div id="cameraView" class="tab-content">
            <div class="camera-section">
                <div class="video-wrapper">
                    <video id="video" autoplay playsinline muted></video>
                    <div class="guide-box">
                        <span class="guide-text">枠内にレシートをかざしてください</span>
                    </div>
                </div>
                
                <div class="controls">
                    <button id="startCamBtn">📷 カメラを起動</button>
                    <button id="manualScanBtn" style="display:none;" class="btn-success">⚡ 今すぐ解析（手動）</button>
                </div>
                <div id="status">「カメラを起動」ボタンを押してください</div>
            </div>
            <canvas id="canvas" style="display:none;"></canvas>
        </div>

        <!-- 2. 支出一覧（決算報告用）ビュー -->
        <div id="listView" class="tab-content" style="display:none;">
            <h3>支出一覧（Excel風 縦軸表示）</h3>
            
            <div id="receiptCardsContainer">
                <!-- 縦軸固定のExcel風テーブルがここに動的生成されます -->
            </div>

            <!-- 補助額と残金の自動計算枠 -->
            <div class="summary-box">
                <div class="summary-inputs">
                    <label for="subsidyAmount">青藍会補助支給額: ¥</label>
                    <input type="number" id="subsidyAmount" value="0" min="0" onchange="updateSummary()" oninput="updateSummary()">
                </div>
                <div class="summary-results">
                    合計件数: <span id="totalCount">0</span> 件 | 
                    支出合計額: ¥<span id="totalSum">0</span><br>
                    <span class="refund-text">残金（返金額）: ¥<span id="remainingAmount">0</span></span>
                </div>
            </div>

            <!-- ファイル出力・印刷ボタン -->
            <div class="action-bar">
                <button onclick="exportCSV()" class="btn-secondary">📊 CSV出力（Excel用）</button>
                <button onclick="printA4Sheets()" class="btn-success">🖨️ A4貼り付け台紙の印刷・PDF出力</button>
            </div>
        </div>

        <!-- 3. 手動入力ビュー -->
        <div id="manualView" class="tab-content" style="display:none;">
            <h3>手動入力フォーム</h3>
            <form id="manualForm" style="background: #f0f4f8; padding: 20px; border-radius: 8px; border: 1px solid #d0d7de;">
                <div class="manual-form-group">
                    <label for="m_date">日付 (YYYY-MM-DD):</label>
                    <input type="text" id="m_date" placeholder="例: 2026-06-12" required>
                </div>
                <div class="manual-form-group">
                    <label for="m_store">支払先（店舗名）:</label>
                    <input type="text" id="m_store" placeholder="例: 〇〇文具店" required>
                </div>
                <div class="manual-form-group">
                    <label for="m_addressee">宛名:</label>
                    <input type="text" id="m_addressee" placeholder="例: 東邦大学〇〇部" required>
                </div>
                <div class="manual-form-group">
                    <label for="m_proviso">但書（品名など）:</label>
                    <input type="text" id="m_proviso" placeholder="例: 大会用備品代" required>
                </div>
                <div class="manual-form-group">
                    <label for="m_payment">支払方法:</label>
                    <select id="m_payment">
                        <option value="現金">現金</option>
                        <option value="クレジットカード">クレジットカード</option>
                        <option value="銀行振込">銀行振込</option>
                        <option value="その他">その他</option>
                    </select>
                </div>
                <div class="manual-form-group">
                    <label for="m_amount">金額(円):</label>
                    <input type="number" id="m_amount" placeholder="例: 5000" required>
                </div>
                <button type="submit" class="btn-success" style="width: 100%; padding: 12px; font-size: 16px;">＋ 支出一覧に追加</button>
            </form>
        </div>
    </div>

    <!-- 印刷専用領域 -->
    <div id="printArea" style="display:none;"></div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const startCamBtn = document.getElementById('startCamBtn');
        const manualScanBtn = document.getElementById('manualScanBtn');
        const status = document.getElementById('status');

        let isAnalyzing = false;
        let stream = null;
        let scanInterval = null;
        let lastFrameData = null;
        let stableCount = 0;
        let receiptData = [];

        // タブ切り替え機能
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

            if (tabName === 'camera') {
                document.getElementById('cameraView').style.display = 'block';
                document.getElementById('btnTabCamera').classList.add('active');
            } else if (tabName === 'list') {
                document.getElementById('listView').style.display = 'block';
                document.getElementById('btnTabList').classList.add('active');
                renderList();
            } else if (tabName === 'manual') {
                document.getElementById('manualView').style.display = 'block';
                document.getElementById('btnTabManual').classList.add('active');
            }
        }

        // カメラ起動
        startCamBtn.addEventListener('click', async () => {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: "environment" } }
                }).catch(() => {
                    return navigator.mediaDevices.getUserMedia({ video: true });
                });

                video.srcObject = stream;
                startCamBtn.style.display = 'none';
                manualScanBtn.style.display = 'inline-block';
                status.innerText = "🔍 レシートをカメラに固定してください（自動検出中...）";

                scanInterval = setInterval(checkFrameStability, 300);

            } catch (err) {
                alert("カメラの起動に失敗しました。カメラのアクセス許可を確認してください。");
                console.error(err);
            }
        });

        manualScanBtn.addEventListener('click', () => {
            if (!isAnalyzing) captureAndUpload();
        });

        // 映像ブレの自動判定
        function checkFrameStability() {
            if (isAnalyzing || !video.videoWidth) return;

            const ctx = canvas.getContext('2d');
            canvas.width = 100;
            canvas.height = 100;
            ctx.drawImage(video, 0, 0, 100, 100);

            const currentFrame = ctx.getImageData(0, 0, 100, 100).data;

            if (lastFrameData) {
                let diff = 0;
                for (let i = 0; i < currentFrame.length; i += 16) {
                    diff += Math.abs(currentFrame[i] - lastFrameData[i]);
                }

                if (diff < 1500) { 
                    stableCount++;
                    status.innerText = `🎯 固定を検知中... (${stableCount}/3)`;
                    
                    if (stableCount >= 3) {
                        stableCount = 0;
                        captureAndUpload();
                    }
                } else {
                    stableCount = 0;
                    status.innerText = "🔍 レシートをカメラに固定してください（自動検出中...）";
                }
            }
            lastFrameData = currentFrame;
        }

        // キャプチャ＆アップロード
        async function captureAndUpload() {
            isAnalyzing = true;
            status.innerText = "⚡ 解析中... (動かさないでください)";

            const width = 600;
            const height = Math.round((video.videoHeight * width) / video.videoWidth);
            canvas.width = width;
            canvas.height = height;

            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, width, height);
            const imageDataUrl = canvas.toDataURL('image/jpeg', 0.8);

            canvas.toBlob(async (blob) => {
                const formData = new FormData();
                formData.append('file', blob, 'receipt.jpg');

                try {
                    const response = await fetch('/upload', {
                        method: 'POST',
                        body: formData
                    });
                    const data = await response.json();

                    if (data.result) {
                        const parsed = JSON.parse(data.result);
                        parsed.imageData = imageDataUrl;
                        addReceiptToList(parsed);
                        status.innerText = "✅ 追加しました！次のレシートをかざせます";
                        
                        document.querySelector('.video-wrapper').style.opacity = '0.3';
                        setTimeout(() => document.querySelector('.video-wrapper').style.opacity = '1', 200);

                    } else {
                        status.innerText = "❌ 認識失敗: " + (data.error || "もう一度かざしてください");
                    }
                } catch (err) {
                    status.innerText = "❌ 通信エラーが発生しました";
                    console.error(err);
                } finally {
                    setTimeout(() => {
                        isAnalyzing = false;
                        stableCount = 0;
                        lastFrameData = null;
                        status.innerText = "🔍 レシートをカメラに固定してください（自動検出中...）";
                    }, 2500);
                }
            }, 'image/jpeg', 0.6);
        }

        // 手動入力フォーム送信イベント
        document.getElementById('manualForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const item = {
                date: document.getElementById('m_date').value,
                store_name: document.getElementById('m_store').value,
                addressee: document.getElementById('m_addressee').value,
                proviso: document.getElementById('m_proviso').value,
                payment_method: document.getElementById('m_payment').value,
                total_amount: Number(document.getElementById('m_amount').value) || 0,
                doc_type: '領収書',
                imageData: '',
                warnings: []
            };

            receiptData.push(item);
            recheckWarnings(receiptData.length - 1);
            
            this.reset();
            alert('支出一覧に追加しました！');
            switchTab('list');
        });

        function addReceiptToList(parsedItem) {
            receiptData.push({
                date: parsedItem.date || '',
                store_name: parsedItem.store_name || '',
                addressee: parsedItem.addressee || '',
                proviso: parsedItem.proviso || '',
                payment_method: parsedItem.payment_method || '',
                total_amount: parsedItem.total_amount || 0,
                doc_type: parsedItem.doc_type || '領収書',
                imageData: parsedItem.imageData || '',
                warnings: parsedItem.warnings || []
            });
        }

        // Excel風 縦軸固定レンダリング関数
        function renderList() {
            const container = document.getElementById('receiptCardsContainer');
            container.innerHTML = '';

            if (receiptData.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding:30px; color:#666;">データが登録されていません。「カメラ読み取り」または「手動入力」から追加してください。</div>';
                updateSummary();
                return;
            }

            const table = document.createElement('table');
            table.className = 'excel-vertical-table';

            // 項目見出し（縦軸）
            const labels = [
                '通し番号',
                '日付',
                '支払先（店舗名）',
                '宛名',
                '但書（品名など）',
                '支払方法',
                '金額(円)',
                'ガイドライン不備チェック・警告',
                '操作'
            ];

            // 縦軸の見出し行を生成
            const rows = labels.map(label => {
                const tr = document.createElement('tr');
                const th = document.createElement('th');
                th.innerText = label;
                th.className = 'sticky-header';
                tr.appendChild(th);
                return tr;
            });

            // 各レシートのデータを列（横方向）に追加
            receiptData.forEach((item, index) => {
                // 0: 通し番号
                const td0 = document.createElement('td');
                td0.innerText = `① ${index + 1}`;
                td0.style.fontWeight = 'bold';
                td0.style.textAlign = 'center';
                td0.style.backgroundColor = '#f8f9fa';
                rows[0].appendChild(td0);

                // 1: 日付
                rows[1].appendChild(createInputTd(item.date, (v) => { item.date = v; recheckWarnings(index); }));

                // 2: 支払先（店舗名）
                rows[2].appendChild(createInputTd(item.store_name, (v) => item.store_name = v));

                // 3: 宛名
                rows[3].appendChild(createInputTd(item.addressee, (v) => { item.addressee = v; recheckWarnings(index); }));

                // 4: 但書（品名など）
                rows[4].appendChild(createInputTd(item.proviso, (v) => { item.proviso = v; recheckWarnings(index); }));

                // 5: 支払方法
                rows[5].appendChild(createInputTd(item.payment_method, (v) => item.payment_method = v));

                // 6: 金額(円)
                rows[6].appendChild(createInputTd(item.total_amount, (v) => {
                    item.total_amount = Number(v) || 0;
                    recheckWarnings(index);
                    updateSummary();
                }, 'number'));

                // 7: ガイドライン不備チェック・警告
                const tdWarn = document.createElement('td');
                tdWarn.id = `warn-${index}`;
                tdWarn.style.minWidth = '220px';
                renderWarningsTd(tdWarn, item.warnings);
                rows[7].appendChild(tdWarn);

                // 8: 操作
                const tdAction = document.createElement('td');
                tdAction.style.textAlign = 'center';
                const delBtn = document.createElement('button');
                delBtn.innerText = '削除';
                delBtn.className = 'btn-danger';
                delBtn.onclick = () => {
                    receiptData.splice(index, 1);
                    renderList();
                };
                tdAction.appendChild(delBtn);
                rows[8].appendChild(tdAction);
            });

            rows.forEach(tr => table.appendChild(tr));

            const responsiveWrapper = document.createElement('div');
            responsiveWrapper.className = 'table-responsive';
            responsiveWrapper.appendChild(table);

            container.appendChild(responsiveWrapper);

            updateSummary();
        }

        function createInputTd(value, onChange, type = 'text') {
            const td = document.createElement('td');
            td.style.minWidth = '160px';
            const input = document.createElement('input');
            input.type = type;
            input.value = value;
            input.onchange = (e) => onChange(e.target.value);
            td.appendChild(input);
            return td;
        }

        function renderWarningsTd(tdElement, warnings) {
            tdElement.innerHTML = '';
            if (!warnings || warnings.length === 0) {
                tdElement.innerHTML = '<span style="color: green; font-size: 12px; font-weight: bold;">問題なし</span>';
            } else {
                warnings.forEach(w => {
                    const tag = document.createElement('span');
                    tag.className = 'warning-tag';
                    tag.innerText = '⚠️ ' + w;
                    tdElement.appendChild(tag);
                });
            }
        }

        function recheckWarnings(index) {
            const item = receiptData[index];
            const warnings = [];

            if (!item.addressee || !item.addressee.includes('東邦大学')) {
                warnings.push('宛名が大学・団体名ではありません（個人名・立替の場合は部員名簿等の添付が必要です）。');
            }
            if (item.proviso.includes('品代') || item.proviso.includes('備品代')) {
                warnings.push('但書が曖昧です（具体的な購入品がわかる明細レシート等を添付してください）。');
            }
            if (Number(item.total_amount) >= 50000) {
                warnings.push('5万円以上の支出です（収入印紙・割印の貼付、および使途・数量等の説明資料が必要です）。');
            }
            if (item.doc_type && !['領収書', '領収証', '領収証書'].includes(item.doc_type)) {
                warnings.push('「領収証」以外の書類は不可です（支払事実が確認できる書類が必要です）。');
            }
            if (item.proviso.includes('エントリー') || item.proviso.includes('分担金') || item.proviso.includes('参加費')) {
                warnings.push('大会の概要（費用・主催者・支払先が判る資料）の添付が必要です。');
            }

            item.warnings = warnings;
            const tdWarn = document.getElementById(`warn-${index}`);
            if (tdWarn) {
                renderWarningsTd(tdWarn, warnings);
            }
        }

        function updateSummary() {
            let sum = 0;
            receiptData.forEach(item => {
                sum += Number(item.total_amount) || 0;
            });
            const subsidy = Number(document.getElementById('subsidyAmount').value) || 0;
            const remaining = subsidy - sum;

            document.getElementById('totalCount').innerText = receiptData.length;
            document.getElementById('totalSum').innerText = sum.toLocaleString();
            document.getElementById('remainingAmount').innerText = remaining.toLocaleString();
        }

        // CSV出力
        function exportCSV() {
            if (receiptData.length === 0) {
                alert("出力するデータがありません。");
                return;
            }

            let csvContent = "\uFEFF通し番号,日付,支払先,宛名,但書,支払方法,金額(円),不備チェック警告\n";

            receiptData.forEach((item, index) => {
                const warnText = item.warnings.join(' / ').replace(/"/g, '""');
                csvContent += `"${index + 1}","${item.date}","${item.store_name}","${item.addressee}","${item.proviso}","${item.payment_method}","${item.total_amount}","${warnText}"\n`;
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `青藍会決算報告_支出一覧_${new Date().toISOString().slice(0,10)}.csv`;
            a.click();
            URL.revokeObjectURL(url);
        }

        // A4印刷出力
        function printA4Sheets() {
            if (receiptData.length === 0) {
                alert("印刷するデータがありません。");
                return;
            }

            const printArea = document.getElementById('printArea');
            printArea.innerHTML = '';

            receiptData.forEach((item, index) => {
                const sheet = document.createElement('div');
                sheet.className = 'a4-sheet';

                sheet.innerHTML = `
                    <div class="a4-header">
                        <span>通し番号: ① ${index + 1}</span>
                        <span>東邦大学青藍会 決算報告 証拠書類貼付台紙</span>
                    </div>
                    <div class="a4-body">
                        ${item.imageData ? `<img src="${item.imageData}" class="a4-img">` : '<p>（手動入力データのため画像なし）</p>'}
                    </div>
                    <div class="a4-details">
                        <hr>
                        <strong>【記載内容確認】</strong><br>
                        日付: ${item.date} | 金額: ¥${Number(item.total_amount).toLocaleString()} | 支払先: ${item.store_name}<br>
                        宛名: ${item.addressee} | 但書: ${item.proviso} | 支払方法: ${item.payment_method}<br>
                        ${item.warnings.length > 0 ? `<span style="color:red;">⚠️ 注意事項: ${item.warnings.join(', ')}</span>` : ''}
                    </div>
                `;
                printArea.appendChild(sheet);
            });

            printArea.style.display = 'block';
            window.print();
            printArea.style.display = 'none';
        }
    </script>
</body>
</html>
