<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>東邦大学 青藍会 決算報告用レシート管理システム</title>

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter & Noto Sans JP -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 0;
            margin: 0;
            background-color: rgba(242, 202, 126, 0.12);
            color: #011126;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ヘッダー */
        header {
            background-color: #011126;
            color: white;
            padding: 12px 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            position: sticky;
            top: 0;
            z-index: 30;
        }
        .header-content {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .header-title-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header-icon {
            width: 32px;
            height: 32px;
            background-color: #ADA605;
            color: #011126;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
        }
        .header-title {
            font-size: 15px;
            font-weight: 700;
            margin: 0;
            color: #ffffff;
            letter-spacing: -0.02em;
        }
        .header-subtitle {
            font-size: 10px;
            color: rgba(242, 202, 126, 0.85);
            margin: 0;
        }

        /* メインコンテナ */
        .container {
            max-width: 1000px;
            width: 100%;
            margin: 12px auto;
            padding: 0 12px;
            flex-grow: 1;
        }

        /* タブナビゲーション */
        .tab-nav {
            display: flex;
            gap: 6px;
            background-color: #e7e5e4;
            padding: 4px;
            border-radius: 12px;
            margin-bottom: 12px;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.06);
        }
        .tab-btn {
            flex: 1;
            padding: 10px 8px;
            border: none;
            background-color: transparent;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            border-radius: 8px;
            color: #57534e;
            text-align: center;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .tab-btn.active {
            background-color: #ffffff;
            color: #011126;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
        }

        /* カメラエリア */
        .camera-section {
            padding: 16px;
            background: #011126;
            color: #fff;
            border-radius: 16px;
            text-align: center;
            position: relative;
            box-shadow: 0 4px 12px rgba(1, 17, 38, 0.15);
            border: 1px solid rgba(242, 202, 126, 0.3);
        }
        .video-wrapper {
            position: relative;
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            overflow: hidden;
            border-radius: 12px;
            background: #000;
            border: 1px solid rgba(242, 202, 126, 0.2);
        }
        video { width: 100%; height: auto; display: block; }
        
        .guide-box {
            position: absolute; top: 8%; left: 8%; width: 84%; height: 84%;
            border: 2px dashed #ADA605; border-radius: 10px; box-sizing: border-box;
            pointer-events: none; display: flex; align-items: center; justify-content: center;
        }
        .guide-text { color: #F2CA7E; background: rgba(1, 17, 38, 0.85); padding: 5px 10px; border-radius: 6px; font-size: 11px; font-weight: 600; }

        .controls { margin-top: 12px; display: flex; gap: 10px; justify-content: center; }
        button {
            background-color: #565902;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            min-height: 42px;
            touch-action: manipulation;
            transition: opacity 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        button:hover { opacity: 0.9; }
        button:disabled { background-color: #78716c; cursor: not-allowed; opacity: 0.6; }
        button.btn-success { background-color: #565902; color: #ffffff; }
        button.btn-danger { background-color: #dc3545; padding: 6px 12px; min-height: 34px; }
        button.btn-secondary { background-color: #011126; color: #ffffff; }
        button.btn-sheets { background-color: #0F9D58; color: #ffffff; }
        
        #status { margin-top: 10px; font-weight: 700; color: #F2CA7E; min-height: 20px; font-size: 12px; }

        /* ひな形デザインのフォームヘッダー */
        .excel-form-header {
            background-color: #ffffff;
            border: 2px solid #ADA605;
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .excel-title {
            text-align: center;
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 14px;
            color: #011126;
            border-bottom: 2px dashed #ADA605;
            padding-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }
        @media (min-width: 600px) {
            .form-grid { grid-template-columns: 1fr 1fr; }
        }
        .form-item { display: flex; align-items: center; justify-content: space-between; font-size: 13px; font-weight: 700; color: #011126; }
        .form-item label { min-width: 90px; color: #565902; }

        /* GAS設定枠 */
        .gas-setting-box {
            background-color: rgba(15, 157, 88, 0.08);
            border: 1.5px solid #0F9D58;
            border-radius: 10px;
            padding: 10px 12px;
            margin-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .gas-setting-box label {
            font-size: 11px;
            font-weight: 700;
            color: #0F9D58;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Excel風 縦軸固定テーブルレイアウト */
        .table-responsive {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin-top: 10px;
            border: 1px solid #e7e5e4;
            border-radius: 12px;
            background: #fff;
            box-shadow: 0 1px 4px rgba(0,0,0,0.04);
        }
        .excel-vertical-table {
            border-collapse: collapse;
            width: max-content;
            min-width: 100%;
        }
        .excel-vertical-table th, .excel-vertical-table td {
            border: 1px solid #e7e5e4;
            padding: 8px 10px;
            font-size: 12px;
            vertical-align: middle;
        }
        .excel-vertical-table th.sticky-header {
            position: sticky;
            left: 0;
            background-color: #f5f5f4;
            z-index: 2;
            min-width: 150px;
            max-width: 160px;
            box-shadow: 2px 0 5px rgba(0,0,0,0.05);
            font-weight: 700;
            color: #011126;
            text-align: left;
            font-size: 12px;
        }

        input[type="text"], input[type="number"], select {
            width: 100%;
            box-sizing: border-box;
            padding: 8px 10px;
            border: 1px solid #d6d3d1;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            color: #011126;
            background-color: #ffffff;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus, input[type="number"]:focus, select:focus {
            outline: none;
            border-color: #ADA605;
        }

        .warning-tag {
            display: block;
            background-color: rgba(242, 202, 126, 0.25);
            color: #565902;
            border: 1px solid #ADA605;
            padding: 4px 6px;
            border-radius: 6px;
            margin-bottom: 4px;
            font-size: 11px;
            font-weight: 600;
            line-height: 1.3;
        }
        
        /* 決算報告まとめ計算ボックス */
        .summary-box {
            margin-top: 14px;
            padding: 14px;
            background: rgba(242, 202, 126, 0.18);
            border-radius: 12px;
            border: 1px solid #ADA605;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .summary-results { font-size: 14px; font-weight: 700; text-align: left; line-height: 1.8; color: #011126; }
        .refund-text { color: #dc3545; font-size: 16px; font-weight: 700; display: block; margin-top: 4px; }

        .action-bar { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
        .action-bar button { width: 100%; font-size: 13px; }

        .manual-card {
            background: #ffffff;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid #e7e5e4;
            box-shadow: 0 1px 4px rgba(0,0,0,0.04);
        }
        .manual-form-group { margin-bottom: 12px; }
        .manual-form-group label { display: block; font-weight: 700; margin-bottom: 4px; font-size: 12px; color: #011126; }

        @media (min-width: 768px) {
            .action-bar { flex-direction: row; justify-content: flex-end; flex-wrap: wrap; }
            .action-bar button { width: auto; }
            .excel-vertical-table th.sticky-header { min-width: 180px; font-size: 12px; }
            input[type="text"], input[type="number"], select { font-size: 13px; padding: 7px; }
        }

        @media print {
            body * { visibility: hidden; }
            #printArea, #printArea * { visibility: visible; }
            #printArea { position: absolute; left: 0; top: 0; width: 100%; }
            .a4-sheet { page-break-after: always; width: 210mm; height: 280mm; padding: 15mm; box-sizing: border-box; border: 2px solid #333; margin-bottom: 20px; }
            .a4-header { font-size: 20px; font-weight: bold; border-bottom: 2px solid #000; padding-bottom: 5px; margin-bottom: 15px; display: flex; justify-content: space-between; }
            .a4-body { text-align: center; margin-top: 20px; }
            .a4-img { max-width: 100%; max-height: 180mm; border: 1px solid #999; }
            .a4-details { margin-top: 15px; text-align: left; font-size: 14px; line-height: 1.6; }
        }
    </style>
</head>
<body>

    <!-- ヘッダーバー -->
    <header>
        <div class="header-content">
            <div class="header-title-box">
                <div class="header-icon">
                    <i class="fa-solid fa-receipt"></i>
                </div>
                <div>
                    <h1 class="header-title">東邦大学 青藍会 決算報告システム</h1>
                    <p class="header-subtitle">補助費決算報告書・レシートAI解析・自動採番</p>
                </div>
            </div>
        </div>
    </header>

    <div class="container">
        <!-- タブナビゲーション -->
        <div class="tab-nav">
            <button class="tab-btn active" id="btnTabCamera" onclick="switchTab('camera')">
                <i class="fa-solid fa-camera"></i> カメラ解析
            </button>
            <button class="tab-btn" id="btnTabList" onclick="switchTab('list')">
                <i class="fa-solid fa-file-invoice-dollar"></i> 支出一覧
            </button>
            <button class="tab-btn" id="btnTabManual" onclick="switchTab('manual')">
                <i class="fa-solid fa-pen-to-square"></i> 手動入力
            </button>
        </div>

        <!-- 1. カメラ読み取りビュー -->
        <div id="cameraView" class="tab-content">
            <div class="camera-section">
                <div class="video-wrapper">
                    <video id="video" autoplay playsinline muted></video>
                    <div class="guide-box">
                        <span class="guide-text"><i class="fa-solid fa-expand mr-1"></i>枠内にレシートを収めてください</span>
                    </div>
                </div>
                
                <div class="controls">
                    <button id="startCamBtn"><i class="fa-solid fa-video"></i> カメラを起動</button>
                    <button id="manualScanBtn" style="display:none;" class="btn-success"><i class="fa-solid fa-bolt"></i> 今すぐ解析</button>
                </div>
                <div id="status">「カメラを起動」ボタンを押してください</div>
            </div>
            <canvas id="canvas" style="display:none;"></canvas>
        </div>

        <!-- 2. 支出一覧（決算報告用）ビュー -->
        <div id="listView" class="tab-content" style="display:none;">
            
            <!-- ひな形「決算報告」シートフォーム -->
            <div class="excel-form-header">
                <div class="excel-title">
                    <i class="fa-solid fa-file-excel text-[#ADA605]"></i> 2026年度 決算報告書ヘッダー情報
                </div>
                <div class="form-grid">
                    <div class="form-item">
                        <label for="groupName"><i class="fa-solid fa-users text-xs mr-1"></i> 団体名:</label>
                        <input type="text" id="groupName" value="○○部" placeholder="例: サッカー部">
                    </div>
                    <div class="form-item">
                        <label for="authorName"><i class="fa-solid fa-user text-xs mr-1"></i> 作成者名:</label>
                        <input type="text" id="authorName" placeholder="例: 東邦 太郎">
                    </div>
                    <div class="form-item">
                        <label for="tel"><i class="fa-solid fa-phone text-xs mr-1"></i> TEL:</label>
                        <input type="text" id="tel" placeholder="例: 090-0000-0000">
                    </div>
                    <div class="form-item">
                        <label for="mail"><i class="fa-solid fa-envelope text-xs mr-1"></i> MAIL:</label>
                        <input type="text" id="mail" placeholder="例: sample@toho-u.ac.jp">
                    </div>
                </div>

                <!-- GAS連携URL設定ボックス -->
                <div class="gas-setting-box">
                    <label for="gasUrl"><i class="fa-solid fa-table"></i> Googleスプレッドシート連携 (GAS WebアプリURL):</label>
                    <input type="text" id="gasUrl" value="https://script.google.com/macros/s/AKfycbyNfxNYjljwEf6kR8DlzPve_6ZaG5fiBEPGFQ9jKtBrSZOk-csWg1oRfs7Z2vMRfnlk/exec" placeholder="https://script.google.com/macros/s/.../exec" onchange="saveGasUrl()">
                </div>
            </div>

            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;">
                <h3 style="font-size: 15px; margin: 0; color: #011126; font-weight: 700;">
                    <i class="fa-solid fa-list-check text-[#565902] mr-1"></i> 支出一覧表（決算報告用）
                </h3>
                <button onclick="loadFromGoogleSheets()" style="font-size: 11px; padding: 4px 8px; min-height: auto; background-color: #0F9D58; color: white;">
                    <i class="fa-solid fa-rotate"></i> シートから同期
                </button>
            </div>
            
            <div id="receiptCardsContainer">
                <!-- 決算報告書フォームと同じ構造の縦軸固定テーブルが動的生成されます -->
            </div>

            <!-- 補助額と残金の自動計算枠 -->
            <div class="summary-box">
                <div class="form-item" style="max-width: 320px;">
                    <label for="subsidyAmount" style="min-width: 100px;"><i class="fa-solid fa-coins text-xs mr-1"></i> 補助支給額:</label>
                    <div style="display: flex; align-items: center; gap: 4px; width: 100%;">
                        <span style="font-weight: bold; font-size: 14px;">¥</span>
                        <input type="number" id="subsidyAmount" value="0" min="0" onchange="updateSummary()" oninput="updateSummary()">
                    </div>
                </div>
                <div class="summary-results">
                    件数: <span id="totalCount">0</span> 件 | 
                    支出合計額: ¥<span id="totalSum">0</span><br>
                    <span class="refund-text">残金（返金額）: ¥<span id="remainingAmount">0</span></span>
                </div>
            </div>

            <!-- ファイル出力・Googleスプレッドシート・印刷ボタン -->
            <div class="action-bar">
                <button onclick="exportToGoogleSheets()" class="btn-sheets">
                    <i class="fa-solid fa-file-spreadsheet"></i> Googleスプレッドシートへ記録
                </button>
                <button onclick="exportExcel()" class="btn-success" style="background-color: #1d6f42;">
                    <i class="fa-solid fa-file-excel"></i> ひな形Excel出力 (.xlsx)
                </button>
                <button onclick="exportCSV()" class="btn-secondary">
                    <i class="fa-solid fa-file-csv"></i> CSV出力
                </button>
                <button onclick="printA4Sheets()" class="btn-success">
                    <i class="fa-solid fa-print"></i> A4台紙印刷
                </button>
            </div>
        </div>

        <!-- 3. 手動入力ビュー -->
        <div id="manualView" class="tab-content" style="display:none;">
            <div class="manual-card">
                <h3 style="font-size: 15px; margin-top: 0; margin-bottom: 14px; color: #011126; font-weight: 700;">
                    <i class="fa-solid fa-pen-to-square text-[#565902] mr-1"></i> 領収書データの手動入力
                </h3>
                <form id="manualForm">
                    <div class="manual-form-group">
                        <label for="m_date">支払年月日 (YYYY-MM-DD):</label>
                        <input type="text" id="m_date" placeholder="例: 2026-06-12" required>
                    </div>
                    <div class="manual-form-group">
                        <label for="m_proviso">摘要（但書・品名など）:</label>
                        <input type="text" id="m_proviso" placeholder="例: 大会用備品代" required>
                    </div>
                    <div class="manual-form-group">
                        <label for="m_amount">支出金額(円):</label>
                        <input type="number" id="m_amount" placeholder="例: 5000" required>
                    </div>
                    <div class="manual-form-group">
                        <label for="m_store">備考（購入目的・店舗名など）:</label>
                        <input type="text" id="m_store" placeholder="例: 〇〇文具店 / 〇〇大会用">
                    </div>
                    <div class="manual-form-group">
                        <label for="m_addressee">宛名:</label>
                        <input type="text" id="m_addressee" placeholder="例: 東邦大学〇〇部" value="東邦大学○○部">
                    </div>
                    <div class="manual-form-group">
                        <label for="m_payment">支払方法:</label>
                        <select id="m_payment">
                            <option value="現金">現金</option>
                            <option value="クレジットカード">クレジットカード</option>
                            <option value="銀行振込">銀行振込</option>
                            <option value="その他">その他</option>
                        </select>
                    </div>
                    <button type="submit" class="btn-success" style="width: 100%; padding: 12px; font-size: 15px; margin-top: 8px;">
                        <i class="fa-solid fa-plus-circle"></i> 決算報告書に追加
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- 4. 解析結果の確認・編集モーダル -->
    <div id="previewModal" style="display:none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(1, 17, 38, 0.7); z-index: 100; align-items: center; justify-content: center; padding: 12px; backdrop-filter: blur(4px);">
        <div style="background: #ffffff; width: 100%; max-width: 500px; border-radius: 14px; padding: 18px; border: 2px solid #ADA605; box-shadow: 0 10px 25px rgba(0,0,0,0.2); max-height: 90vh; overflow-y: auto;">
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ADA605; padding-bottom: 8px; margin-bottom: 12px;">
                <h3 style="margin: 0; font-size: 16px; color: #011126; font-weight: 700;">
                    <i class="fa-solid fa-pen-to-square text-[#565902] mr-1"></i> 解析結果の確認・手動修正
                </h3>
                <button type="button" onclick="closePreviewModal()" style="background: none; border: none; font-size: 18px; color: #78716c; cursor: pointer; padding: 4px; min-height: auto;"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <p style="font-size: 11px; color: #565902; font-weight: 600; margin-top: 0; margin-bottom: 12px; background: rgba(242, 202, 126, 0.2); padding: 6px 10px; border-radius: 6px; border-left: 3px solid #ADA605;">
                <i class="fa-solid fa-circle-info mr-1"></i> 自動解析された内容をご確認ください。備考（購入目的）などを自由に書き直してから決算報告書に記録できます。
            </p>

            <form id="previewForm">
                <div class="manual-form-group">
                    <label for="p_date">支払年月日 (YYYY-MM-DD):</label>
                    <input type="text" id="p_date" required>
                </div>
                <div class="manual-form-group">
                    <label for="p_proviso">摘要（但書・品名など）:</label>
                    <input type="text" id="p_proviso" required>
                </div>
                <div class="manual-form-group">
                    <label for="p_amount">支出金額(円):</label>
                    <input type="number" id="p_amount" required>
                </div>
                <div class="manual-form-group">
                    <label for="p_store" style="color: #011126; font-weight: 700;">
                        <i class="fa-solid fa-pen text-[#ADA605] mr-1"></i> 備考（購入目的・店舗名など） <span style="font-size: 10px; color: #565902;">※手動編集可能</span>:
                    </label>
                    <input type="text" id="p_store" placeholder="例: 〇〇文具店 / 〇〇大会用備品代" style="border: 2px solid #ADA605; background-color: #fffdf5;">
                </div>
                <div class="manual-form-group">
                    <label for="p_addressee">宛名:</label>
                    <input type="text" id="p_addressee">
                </div>
                <div class="manual-form-group">
                    <label for="p_payment">支払方法:</label>
                    <select id="p_payment">
                        <option value="現金">現金</option>
                        <option value="クレジットカード">クレジットカード</option>
                        <option value="銀行振込">銀行振込</option>
                        <option value="その他">その他</option>
                    </select>
                </div>

                <div style="display: flex; gap: 8px; margin-top: 16px;">
                    <button type="button" onclick="closePreviewModal()" class="btn-secondary" style="flex: 1; background: #78716c;">
                        キャンセル
                    </button>
                    <button type="submit" class="btn-success" style="flex: 2; padding: 12px; font-size: 14px;">
                        <i class="fa-solid fa-plus-circle"></i> この内容で保存・記録
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- 印刷専用領域 -->
    <div id="printArea" style="display:none;"></div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const startCamBtn = document.getElementById('startCamBtn');
        const manualScanBtn = document.getElementById('manualScanBtn');
        const status = document.getElementById('status');

        let isAnalyzing = false;
        let stream = null;
        let scanInterval = null;
        let lastFrameData = null;
        let stableCount = 0;
        let receiptData = [];
        let currentPendingItem = null;

        // ページ読み込み時にスプレッドシートから自動データ取得
        window.addEventListener('DOMContentLoaded', () => {
            const savedGasUrl = localStorage.getItem('toho_receipt_gas_url');
            if (savedGasUrl) {
                document.getElementById('gasUrl').value = savedGasUrl;
            }
            loadFromGoogleSheets();
        });

        function saveGasUrl() {
            const url = document.getElementById('gasUrl').value.trim();
            localStorage.setItem('toho_receipt_gas_url', url);
        }

        // Googleスプレッドシートからの自動読み込み（同期）関数
        async function loadFromGoogleSheets() {
            const gasUrl = document.getElementById('gasUrl').value.trim();
            if (!gasUrl) return;

            try {
                const response = await fetch(gasUrl);
                const data = await response.json();

                if (data.status === 'success' && Array.isArray(data.receipts)) {
                    receiptData = data.receipts;
                    // 各項目の不備再チェック
                    receiptData.forEach((_, idx) => recheckWarnings(idx));
                    if (document.getElementById('listView').style.display !== 'none') {
                        renderList();
                    }
                }
            } catch (err) {
                console.error("スプレッドシートからの自動読み込みに失敗しました:", err);
            }
        }

        // タブ切り替え機能
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

            if (tabName === 'camera') {
                document.getElementById('cameraView').style.display = 'block';
                document.getElementById('btnTabCamera').classList.add('active');
            } else if (tabName === 'list') {
                document.getElementById('listView').style.display = 'block';
                document.getElementById('btnTabList').classList.add('active');
                renderList();
            } else if (tabName === 'manual') {
                document.getElementById('manualView').style.display = 'block';
                document.getElementById('btnTabManual').classList.add('active');
            }
        }

        // カメラ起動
        startCamBtn.addEventListener('click', async () => {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: "environment" } }
                }).catch(() => {
                    return navigator.mediaDevices.getUserMedia({ video: true });
                });

                video.srcObject = stream;
                startCamBtn.style.display = 'none';
                manualScanBtn.style.display = 'inline-flex';
                status.innerText = "🔍 レシートをカメラに固定してください（自動検出中...）";

                scanInterval = setInterval(checkFrameStability, 300);

            } catch (err) {
                alert("カメラの起動に失敗しました。カメラのアクセス許可を確認してください。");
                console.error(err);
            }
        });

        manualScanBtn.addEventListener('click', () => {
            if (!isAnalyzing) captureAndUpload();
        });

        // 映像ブレの自動判定
        function checkFrameStability() {
            if (isAnalyzing || !video.videoWidth) return;

            const ctx = canvas.getContext('2d');
            canvas.width = 100;
            canvas.height = 100;
            ctx.drawImage(video, 0, 0, 100, 100);

            const currentFrame = ctx.getImageData(0, 0, 100, 100).data;

            if (lastFrameData) {
                let diff = 0;
                for (let i = 0; i < currentFrame.length; i += 16) {
                    diff += Math.abs(currentFrame[i] - lastFrameData[i]);
                }

                if (diff < 1500) { 
                    stableCount++;
                    status.innerText = `🎯 固定を検知中... (${stableCount}/3)`;
                    
                    if (stableCount >= 3) {
                        stableCount = 0;
                        captureAndUpload();
                    }
                } else {
                    stableCount = 0;
                    status.innerText = "🔍 レシートをカメラに固定してください（自動検出中...）";
                }
            }
            lastFrameData = currentFrame;
        }

        // キャプチャ＆アップロード
        async function captureAndUpload() {
            isAnalyzing = true;
            status.innerText = "⚡ 解析中... (動かさないでください)";

            const width = 600;
            const height = Math.round((video.videoHeight * width) / video.videoWidth);
            canvas.width = width;
            canvas.height = height;

            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, width, height);
            const imageDataUrl = canvas.toDataURL('image/jpeg', 0.8);

            canvas.toBlob(async (blob) => {
                const formData = new FormData();
                formData.append('file', blob, 'receipt.jpg');

                try {
                    const response = await fetch('/upload', {
                        method: 'POST',
                        body: formData
                    });
                    const data = await response.json();

                    if (data.result) {
                        const parsed = JSON.parse(data.result);
                        parsed.imageData = imageDataUrl;
                        
                        openPreviewModal(parsed);
                        status.innerText = "📝 解析結果の修正・確認画面が開きました";

                        document.querySelector('.video-wrapper').style.opacity = '0.3';
                        setTimeout(() => document.querySelector('.video-wrapper').style.opacity = '1', 200);

                    } else {
                        status.innerText = "❌ 認識失敗: " + (data.error || "もう一度かざしてください");
                    }
                } catch (err) {
                    status.innerText = "❌ 通信エラーが発生しました";
                    console.error(err);
                } finally {
                    setTimeout(() => {
                        isAnalyzing = false;
                        stableCount = 0;
                        lastFrameData = null;
                        if (document.getElementById('previewModal').style.display === 'none') {
                            status.innerText = "🔍 レシートをカメラに固定してください（自動検出中...）";
                        }
                    }, 2500);
                }
            }, 'image/jpeg', 0.6);
        }

        // 解析結果確認モーダルを開く関数
        function openPreviewModal(parsed) {
            currentPendingItem = parsed;
            document.getElementById('p_date').value = parsed.date || '';
            document.getElementById('p_proviso').value = parsed.proviso || '';
            document.getElementById('p_amount').value = parsed.total_amount || 0;
            document.getElementById('p_store').value = parsed.store_name || '';
            document.getElementById('p_addressee').value = parsed.addressee || '東邦大学○○部';
            document.getElementById('p_payment').value = ['現金', 'クレジットカード', '銀行振込'].includes(parsed.payment_method) ? parsed.payment_method : '現金';

            document.getElementById('previewModal').style.display = 'flex';
        }

        function closePreviewModal() {
            document.getElementById('previewModal').style.display = 'none';
            currentPendingItem = null;
            status.innerText = "🔍 レシートをカメラに固定してください（自動検出中...）";
        }

        document.getElementById('previewForm').addEventListener('submit', function(e) {
            e.preventDefault();
            if (!currentPendingItem) return;

            const item = {
                date: document.getElementById('p_date').value,
                store_name: document.getElementById('p_store').value,
                addressee: document.getElementById('p_addressee').value,
                proviso: document.getElementById('p_proviso').value,
                payment_method: document.getElementById('p_payment').value,
                total_amount: Number(document.getElementById('p_amount').value) || 0,
                doc_type: currentPendingItem.doc_type || '領収書',
                imageData: currentPendingItem.imageData || '',
                warnings: []
            };

            receiptData.push(item);
            recheckWarnings(receiptData.length - 1);

            closePreviewModal();
            alert('修正した内容で決算報告書に追加・記録しました！');
            switchTab('list');
        });

        document.getElementById('manualForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const item = {
                date: document.getElementById('m_date').value,
                store_name: document.getElementById('m_store').value,
                addressee: document.getElementById('m_addressee').value,
                proviso: document.getElementById('m_proviso').value,
                payment_method: document.getElementById('m_payment').value,
                total_amount: Number(document.getElementById('m_amount').value) || 0,
                doc_type: '領収書',
                imageData: '',
                warnings: []
            };

            receiptData.push(item);
            recheckWarnings(receiptData.length - 1);
            
            this.reset();
            alert('決算報告書に追加しました！');
            switchTab('list');
        });

        function getNumberedReceipts() {
            let sorted = receiptData.map((item, originalIndex) => ({ item, originalIndex }));
            sorted.sort((a, b) => {
                const da = a.item.date || '9999-99-99';
                const db = b.item.date || '9999-99-99';
                if (da < db) return -1;
                if (da > db) return 1;
                return a.originalIndex - b.originalIndex;
            });

            sorted.forEach((entry, idx) => {
                entry.item.number = idx + 1;
            });

            return sorted.map(e => e.item);
        }

        function renderList() {
            const container = document.getElementById('receiptCardsContainer');
            container.innerHTML = '';

            if (receiptData.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding:30px 10px; color:#666; font-size:13px; font-weight:bold;">データが登録されていません。<br>「カメラ解析」または「手動入力」から追加してください。</div>';
                updateSummary();
                return;
            }

            getNumberedReceipts();

            let displayItems = [...receiptData].sort((a, b) => {
                const da = a.date || '0000-00-00';
                const db = b.date || '0000-00-00';
                if (da > db) return -1;
                if (da < db) return 1;
                return (b.number || 0) - (a.number || 0);
            });

            const table = document.createElement('table');
            table.className = 'excel-vertical-table';

            const labels = [
                '領収書No.',
                '支払年月日',
                '摘要（但書・品名など）',
                '支出金額(円)',
                '備考（購入の目的・店舗名）',
                '宛名',
                '支払方法',
                'ガイドライン不備チェック・警告',
                '操作'
            ];

            const rows = labels.map(label => {
                const tr = document.createElement('tr');
                const th = document.createElement('th');
                th.innerText = label;
                th.className = 'sticky-header';
                tr.appendChild(th);
                return tr;
            });

            displayItems.forEach((item) => {
                const originalIndex = receiptData.indexOf(item);

                const td0 = document.createElement('td');
                td0.innerText = `${item.number}`;
                td0.style.fontWeight = 'bold';
                td0.style.textAlign = 'center';
                td0.style.backgroundColor = '#f8f9fa';
                rows[0].appendChild(td0);

                rows[1].appendChild(createInputTd(item.date, (v) => {
                    item.date = v;
                    recheckWarnings(originalIndex);
                    renderList();
                }));

                rows[2].appendChild(createInputTd(item.proviso, (v) => { item.proviso = v; recheckWarnings(originalIndex); }));

                rows[3].appendChild(createInputTd(item.total_amount, (v) => {
                    item.total_amount = Number(v) || 0;
                    recheckWarnings(originalIndex);
                    updateSummary();
                }, 'number'));

                rows[4].appendChild(createInputTd(item.store_name, (v) => item.store_name = v));

                rows[5].appendChild(createInputTd(item.addressee, (v) => { item.addressee = v; recheckWarnings(originalIndex); }));

                rows[6].appendChild(createInputTd(item.payment_method, (v) => item.payment_method = v));

                const tdWarn = document.createElement('td');
                tdWarn.id = `warn-${originalIndex}`;
                tdWarn.style.minWidth = '200px';
                renderWarningsTd(tdWarn, item.warnings);
                rows[7].appendChild(tdWarn);

                const tdAction = document.createElement('td');
                tdAction.style.textAlign = 'center';
                const delBtn = document.createElement('button');
                delBtn.innerHTML = '<i class="fa-solid fa-trash-can"></i> 削除';
                delBtn.className = 'btn-danger';
                delBtn.onclick = () => {
                    receiptData.splice(originalIndex, 1);
                    renderList();
                };
                tdAction.appendChild(delBtn);
                rows[8].appendChild(tdAction);
            });

            rows.forEach(tr => table.appendChild(tr));

            const responsiveWrapper = document.createElement('div');
            responsiveWrapper.className = 'table-responsive';
            responsiveWrapper.appendChild(table);

            container.appendChild(responsiveWrapper);

            updateSummary();
        }

        function createInputTd(value, onChange, type = 'text') {
            const td = document.createElement('td');
            td.style.minWidth = '150px';
            const input = document.createElement('input');
            input.type = type;
            input.value = value;
            input.onchange = (e) => onChange(e.target.value);
            td.appendChild(input);
            return td;
        }

        function renderWarningsTd(tdElement, warnings) {
            tdElement.innerHTML = '';
            if (!warnings || warnings.length === 0) {
                tdElement.innerHTML = '<span style="color: #565902; font-size: 11px; font-weight: bold;"><i class="fa-solid fa-circle-check"></i> 問題なし</span>';
            } else {
                warnings.forEach(w => {
                    const tag = document.createElement('span');
                    tag.className = 'warning-tag';
                    tag.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> ' + w;
                    tdElement.appendChild(tag);
                });
            }
        }

        function recheckWarnings(index) {
            const item = receiptData[index];
            if (!item) return;
            const warnings = [];

            if (!item.addressee || !item.addressee.includes('東邦大学')) {
                warnings.push('宛名が大学・団体名ではありません（個人名・立替の場合は部員名簿等の添付が必要です）。');
            }
            if (item.proviso.includes('品代') || item.proviso.includes('備品代')) {
                warnings.push('但書が曖昧です（具体的な購入品がわかる明細レシート等を添付してください）。');
            }
            if (Number(item.total_amount) >= 50000) {
                warnings.push('5万円以上の支出です（収入印紙・割印の貼付、および使途・数量等の説明資料が必要です）。');
            }
            if (item.doc_type && !['領収書', '領収証', '領収証書'].includes(item.doc_type)) {
                warnings.push('「領収証」以外の書類は不可です（支払事実が確認できる書類が必要です）。');
            }
            if (item.proviso.includes('エントリー') || item.proviso.includes('分担金') || item.proviso.includes('参加費')) {
                warnings.push('大会の概要（費用・主催者・支払先が判る資料）の添付が必要です。');
            }

            item.warnings = warnings;
            const tdWarn = document.getElementById(`warn-${index}`);
            if (tdWarn) {
                renderWarningsTd(tdWarn, warnings);
            }
        }

        function updateSummary() {
            let sum = 0;
            receiptData.forEach(item => {
                sum += Number(item.total_amount) || 0;
            });
            const subsidy = Number(document.getElementById('subsidyAmount').value) || 0;
            const remaining = subsidy - sum;

            document.getElementById('totalCount').innerText = receiptData.length;
            document.getElementById('totalSum').innerText = sum.toLocaleString();
            document.getElementById('remainingAmount').innerText = remaining.toLocaleString();
        }

        // Googleスプレッドシートへの一括同期・保存処理
        async function exportToGoogleSheets() {
            if (receiptData.length === 0) {
                alert("送信するデータがありません。");
                return;
            }

            const gasUrl = document.getElementById('gasUrl').value.trim();
            if (!gasUrl) {
                alert("Googleスプレッドシート連携用のGAS WebアプリURLを入力してください。");
                document.getElementById('gasUrl').focus();
                return;
            }

            const sortedReceipts = getNumberedReceipts();

            const payload = {
                receipts: sortedReceipts
            };

            try {
                await fetch(gasUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify(payload)
                });

                alert("Googleスプレッドシートへデータを保存・同期しました！スマホ・PC間で共有されます。");
            } catch (err) {
                alert("スプレッドシートへの送信時に通信エラーが発生しました。URLをご確認ください。");
                console.error(err);
            }
        }

        async function exportExcel() {
            if (receiptData.length === 0) {
                alert("出力するデータがありません。");
                return;
            }

            const sortedReceipts = getNumberedReceipts();

            const payload = {
                receipts: sortedReceipts,
                subsidy: Number(document.getElementById('subsidyAmount').value) || 0,
                group_name: document.getElementById('groupName').value || '○○部',
                author_name: document.getElementById('authorName').value || '',
                tel: document.getElementById('tel').value || '',
                mail: document.getElementById('mail').value || ''
            };

            try {
                const response = await fetch('/export_excel', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const err = await response.json();
                    alert("Excel出力エラー: " + (err.error || "出力に失敗しました"));
                    return;
                }

                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `東邦大学青藍会_決算報告書_${new Date().toISOString().slice(0,10)}.xlsx`;
                a.click();
                URL.revokeObjectURL(url);
            } catch (err) {
                alert("通信エラーが発生しました");
                console.error(err);
            }
        }

        function exportCSV() {
            if (receiptData.length === 0) {
                alert("出力するデータがありません。");
                return;
            }

            const sortedReceipts = getNumberedReceipts();

            let csvContent = "\uFEFF領収書No.,支払年月日,摘要,支出金額(円),備考（店舗名/目的）,宛名,支払方法,不備チェック警告\n";

            sortedReceipts.forEach((item) => {
                const warnText = (item.warnings || []).join(' / ').replace(/"/g, '""');
                csvContent += `"${item.number}","${item.date}","${item.proviso}","${item.total_amount}","${item.store_name}","${item.addressee}","${item.payment_method}","${warnText}"\n`;
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `青藍会決算報告_支出一覧_${new Date().toISOString().slice(0,10)}.csv`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function printA4Sheets() {
            if (receiptData.length === 0) {
                alert("印刷するデータがありません。");
                return;
            }

            const sortedReceipts = getNumberedReceipts();

            const printArea = document.getElementById('printArea');
            printArea.innerHTML = '';

            sortedReceipts.forEach((item) => {
                const sheet = document.createElement('div');
                sheet.className = 'a4-sheet';

                sheet.innerHTML = `
                    <div class="a4-header">
                        <span>領収書No.: ${item.number}</span>
                        <span>東邦大学青藍会 決算報告 証拠書類貼付台紙</span>
                    </div>
                    <div class="a4-body">
                        ${item.imageData ? `<img src="${item.imageData}" class="a4-img">` : '<p>（手動入力データのため画像なし）</p>'}
                    </div>
                    <div class="a4-details">
                        <hr>
                        <strong>【記載内容確認】</strong><br>
                        支払年月日: ${item.date} | 支出金額: ¥${Number(item.total_amount).toLocaleString()} | 摘要: ${item.proviso}<br>
                        備考/支払先: ${item.store_name} | 宛名: ${item.addressee} | 支払方法: ${item.payment_method}<br>
                        ${(item.warnings && item.warnings.length > 0) ? `<span style="color:red;">⚠️ 注意事項: ${item.warnings.join(', ')}</span>` : ''}
                    </div>
                `;
                printArea.appendChild(sheet);
            });

            printArea.style.display = 'block';
            window.print();
            printArea.style.display = 'none';
        }
    </script>
</body>
</html>
