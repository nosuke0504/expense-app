<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>青藍会 決算報告用レシート管理アプリ</title>
    <style>
        body { font-family: sans-serif; padding: 15px; background-color: #f8f9fa; color: #333; margin: 0; }
        .container { max-width: 1200px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h2 { border-bottom: 2px solid #0066cc; padding-bottom: 8px; color: #0066cc; margin-top: 0; }
        
        /* カメラ表示エリア */
        .camera-section { margin-bottom: 20px; padding: 15px; background: #111; color: #fff; border-radius: 8px; text-align: center; position: relative; }
        .video-wrapper { position: relative; width: 100%; max-width: 480px; margin: 0 auto; overflow: hidden; border-radius: 8px; background: #000; }
        video { width: 100%; height: auto; display: block; }
        
        /* レシート合わせ枠（ガイドライン） */
        .guide-box {
            position: absolute; top: 10%; left: 10%; width: 80%; height: 80%;
            border: 2px dashed #00ffcc; border-radius: 8px; box-sizing: border-box;
            pointer-events: none; display: flex; align-items: center; justify-content: center;
        }
        .guide-text { color: #00ffcc; background: rgba(0,0,0,0.6); padding: 4px 8px; border-radius: 4px; font-size: 12px; }

        .controls { margin-top: 12px; }
        button { background-color: #0066cc; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: bold; }
        button:disabled { background-color: #777; cursor: not-allowed; }
        button.btn-danger { background-color: #dc3545; }
        
        #status { margin-top: 10px; font-weight: bold; color: #00ffcc; min-height: 24px; }
        
        /* テーブル表示 */
        .table-responsive { overflow-x: auto; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        th, td { border: 1px solid #d0d7de; padding: 8px; text-align: left; vertical-align: top; }
        th { background-color: #f0f4f8; font-weight: bold; text-align: center; }
        .num-col { text-align: center; width: 50px; font-weight: bold; }
        input[type="text"], input[type="number"] { width: 100%; box-sizing: border-box; padding: 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
        .warning-tag { display: block; background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; padding: 4px 6px; border-radius: 4px; margin-bottom: 4px; font-size: 12px; }
        .summary-box { margin-top: 20px; padding: 15px; background: #f0f4f8; border-radius: 6px; font-size: 16px; font-weight: bold; text-align: right; border: 1px solid #d0d7de; }
    </style>
</head>
<body>
    <div class="container">
        <h2>青藍会 決算報告用レシート管理</h2>
        
        <div class="camera-section">
            <div class="video-wrapper">
                <video id="video" autoplay playsinline muted></video>
                <div class="guide-box">
                    <span class="guide-text">枠内にレシートをかざしてください</span>
                </div>
            </div>
            
            <div class="controls">
                <button id="startCamBtn">📷 カメラを起動</button>
                <button id="manualScanBtn" style="display:none; background-color: #28a745;">⚡ 今すぐ解析（手動）</button>
            </div>
            <div id="status">「カメラを起動」ボタンを押してください</div>
        </div>

        <!-- 内部キャプチャ用Canvas（非表示） -->
        <canvas id="canvas" style="display:none;"></canvas>

        <div id="listSection">
            <h3>支出一覧（決算報告用）</h3>
            <div class="table-responsive">
                <table id="receiptTable">
                    <thead>
                        <tr>
                            <th style="width: 50px;">通し番号</th>
                            <th style="width: 110px;">日付</th>
                            <th style="width: 140px;">支払先（店舗名）</th>
                            <th style="width: 130px;">宛名</th>
                            <th style="width: 140px;">但書（品名など）</th>
                            <th style="width: 90px;">支払方法</th>
                            <th style="width: 100px;">金額(円)</th>
                            <th>ガイドライン不備チェック・警告</th>
                            <th style="width: 60px;">操作</th>
                        </tr>
                    </thead>
                    <tbody id="receiptList">
                        <!-- 動的に追加される行 -->
                    </tbody>
                </table>
            </div>

            <div class="summary-box">
                合計件数: <span id="totalCount">0</span> 件 | 支出合計額: ¥<span id="totalSum">0</span>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const startCamBtn = document.getElementById('startCamBtn');
        const manualScanBtn = document.getElementById('manualScanBtn');
        const status = document.getElementById('status');

        let isAnalyzing = false;
        let stream = null;
        let scanInterval = null;
        let lastFrameData = null;
        let stableCount = 0;
        let receiptData = [];

        // カメラ起動
        startCamBtn.addEventListener('click', async () => {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: "environment" } } // 背面カメラを優先
                }).catch(() => {
                    // 背面カメラが特定できない場合は通常のカメラで起動
                    return navigator.mediaDevices.getUserMedia({ video: true });
                });

                video.srcObject = stream;
                startCamBtn.style.display = 'none';
                manualScanBtn.style.display = 'inline-block';
                status.innerText = "🔍 レシートをカメラに固定してください（自動検出中...）";

                // 自動静止検知ループの開始（300msごと）
                scanInterval = setInterval(checkFrameStability, 300);

            } catch (err) {
                alert("カメラの起動に失敗しました。カメラのアクセス許可を確認してください。");
                console.error(err);
            }
        });

        // 手動キャプチャボタン
        manualScanBtn.addEventListener('click', () => {
            if (!isAnalyzing) {
                captureAndUpload();
            }
        });

        // 映像のブレ（静止状態）をチェックして自動解析をトリガー
        function checkFrameStability() {
            if (isAnalyzing || !video.videoWidth) return;

            const ctx = canvas.getContext('2d');
            // 軽量化のために極小サイズで差分判定
            canvas.width = 100;
            canvas.height = 100;
            ctx.drawImage(video, 0, 0, 100, 100);

            const currentFrame = ctx.getImageData(0, 0, 100, 100).data;

            if (lastFrameData) {
                let diff = 0;
                // ピクセル差分の簡易計算
                for (let i = 0; i < currentFrame.length; i += 16) {
                    diff += Math.abs(currentFrame[i] - lastFrameData[i]);
                }

                // 動きが小さい（静止している）場合
                if (diff < 1500) { 
                    stableCount++;
                    status.innerText = `🎯 固定を検知中... (${stableCount}/3)`;
                    
                    // 3回連続（約0.9秒間）静止したら自動撮影！
                    if (stableCount >= 3) {
                        stableCount = 0;
                        captureAndUpload();
                    }
                } else {
                    stableCount = 0;
                    status.innerText = "🔍 レシートをカメラに固定してください（自動検出中...）";
                }
            }
            lastFrameData = currentFrame;
        }

        // キャプチャ＆サーバー送信
        async function captureAndUpload() {
            isAnalyzing = true;
            status.innerText = "⚡ 解析中... (動かさないでください)";

            // 高精細用にCanvasサイズを設定
            const width = 500;
            const height = Math.round((video.videoHeight * width) / video.videoWidth);
            canvas.width = width;
            canvas.height = height;

            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, width, height);

            // JPEG Blob化 (画質0.5)
            canvas.toBlob(async (blob) => {
                const formData = new FormData();
                formData.append('file', blob, 'receipt.jpg');

                try {
                    const response = await fetch('/upload', {
                        method: 'POST',
                        body: formData
                    });
                    const data = await response.json();

                    if (data.result) {
                        const parsed = JSON.parse(data.result);
                        addReceiptToList(parsed);
                        status.innerText = "✅ 追加しました！次のレシートをかざせます";
                        
                        // 効果音代わりの視覚フィードバック（画面を一瞬白くする）
                        document.querySelector('.video-wrapper').style.opacity = '0.3';
                        setTimeout(() => document.querySelector('.video-wrapper').style.opacity = '1', 200);

                    } else {
                        status.innerText = "❌ 認識失敗: " + (data.error || "もう一度かざしてください");
                    }
                } catch (err) {
                    status.innerText = "❌ 通信エラーが発生しました";
                    console.error(err);
                } finally {
                    // クールダウン（2.5秒間は次の自動解析を行わない）
                    setTimeout(() => {
                        isAnalyzing = false;
                        stableCount = 0;
                        lastFrameData = null;
                        status.innerText = "🔍 レシートをカメラに固定してください（自動検出中...）";
                    }, 2500);
                }
            }, 'image/jpeg', 0.5);
        }

        // --- テーブル追加・管理用ロジック ---
        function addReceiptToList(parsedItem) {
            receiptData.push({
                date: parsedItem.date || '',
                store_name: parsedItem.store_name || '',
                addressee: parsedItem.addressee || '',
                proviso: parsedItem.proviso || '',
                payment_method: parsedItem.payment_method || '',
                total_amount: parsedItem.total_amount || 0,
                warnings: parsedItem.warnings || []
            });
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('receiptList');
            tbody.innerHTML = '';
            let sum = 0;

            receiptData.forEach((item, index) => {
                sum += Number(item.total_amount) || 0;
                const tr = document.createElement('tr');

                // 各セル生成
                tr.appendChild(createTd(index + 1, 'num-col'));
                tr.appendChild(createInputTd(item.date, (v) => item.date = v));
                tr.appendChild(createInputTd(item.store_name, (v) => item.store_name = v));
                tr.appendChild(createInputTd(item.addressee, (v) => { item.addressee = v; recheckWarnings(index); }));
                tr.appendChild(createInputTd(item.proviso, (v) => { item.proviso = v; recheckWarnings(index); }));
                tr.appendChild(createInputTd(item.payment_method, (v) => item.payment_method = v));
                tr.appendChild(createInputTd(item.total_amount, (v) => { 
                    item.total_amount = Number(v) || 0; 
                    recheckWarnings(index);
                    updateSummary(); 
                }, 'number'));

                // 警告セル
                const tdWarn = document.createElement('td');
                tdWarn.id = `warn-${index}`;
                renderWarningsTd(tdWarn, item.warnings);
                tr.appendChild(tdWarn);

                // 削除ボタン
                const tdAction = document.createElement('td');
                tdAction.style.textAlign = 'center';
                const delBtn = document.createElement('button');
                delBtn.innerText = '削除';
                delBtn.className = 'btn-danger';
                delBtn.onclick = () => {
                    receiptData.splice(index, 1);
                    renderTable();
                };
                tdAction.appendChild(delBtn);
                tr.appendChild(tdAction);

                tbody.appendChild(tr);
            });

            document.getElementById('totalCount').innerText = receiptData.length;
            document.getElementById('totalSum').innerText = sum.toLocaleString();
        }

        function createTd(text, className = '') {
            const td = document.createElement('td');
            if (className) td.className = className;
            td.innerText = text;
            return td;
        }

        function createInputTd(value, onChange, type = 'text') {
            const td = document.createElement('td');
            const input = document.createElement('input');
            input.type = type;
            input.value = value;
            input.onchange = (e) => onChange(e.target.value);
            td.appendChild(input);
            return td;
        }

        function renderWarningsTd(tdElement, warnings) {
            tdElement.innerHTML = '';
            if (!warnings || warnings.length === 0) {
                tdElement.innerHTML = '<span style="color: green; font-size: 12px;">問題なし</span>';
            } else {
                warnings.forEach(w => {
                    const tag = document.createElement('span');
                    tag.className = 'warning-tag';
                    tag.innerText = '⚠️ ' + w;
                    tdElement.appendChild(tag);
                });
            }
        }

        function recheckWarnings(index) {
            const item = receiptData[index];
            const warnings = [];

            if (!item.addressee || !item.addressee.includes('東邦大学')) {
                warnings.push('宛名が大学・団体名ではありません（個人名の場合は部員名簿等の添付が必要です）。');
            }
            if (item.proviso.includes('品代') || item.proviso.includes('備品代')) {
                warnings.push('但書が曖昧です（具体的な購入品がわかる明細レシート等を添付してください）。');
            }
            if (Number(item.total_amount) >= 50000) {
                warnings.push('5万円以上の支出です（収入印紙・割印の貼付、またはクレジットカード利用の明記が必要です）。');
            }

            item.warnings = warnings;
            const tdWarn = document.getElementById(`warn-${index}`);
            if (tdWarn) {
                renderWarningsTd(tdWarn, warnings);
            }
        }

        function updateSummary() {
            let sum = 0;
            receiptData.forEach(item => {
                sum += Number(item.total_amount) || 0;
            });
            document.getElementById('totalSum').innerText = sum.toLocaleString();
        }
    </script>
</body>
</html>
