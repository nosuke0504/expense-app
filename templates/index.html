<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>レシート記録アプリ</title>
</head>
<body>
    <h2>レシートを撮影・送信</h2>
    <form id="uploadForm" action="/upload" method="post" enctype="multipart/form-data">
        <input type="file" id="fileInput" name="file" accept="image/*" capture="environment" required>
        <br><br>
        <button type="submit" id="submitBtn">解析して記録</button>
    </form>

    <div id="status" style="margin-top: 15px; font-weight: bold; color: #0066cc;"></div>

    <script>
        document.getElementById('uploadForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const fileInput = document.getElementById('fileInput');
            const status = document.getElementById('status');
            const submitBtn = document.getElementById('submitBtn');

            if (!fileInput.files[0]) return;

            submitBtn.disabled = true;
            status.innerText = "⚡ 画像を軽量化して送信中...";

            const file = fileInput.files[0];
            // スマホ側で最大幅600px・画質0.6に一瞬で圧縮
            const resizedBlob = await resizeImage(file, 600, 0.6);

            status.innerText = "🤖 AI解析中...";

            const formData = new FormData();
            formData.append('file', resizedBlob, 'receipt.jpg');

            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });
                const resultHtml = await response.text();
                document.body.innerHTML = resultHtml;
            } catch (err) {
                status.innerText = "エラーが発生しました";
                submitBtn.disabled = false;
            }
        });

        // ブラウザ側で高速リサイズ・圧縮する関数
        function resizeImage(file, maxWidth, quality) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        let width = img.width;
                        let height = img.height;

                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }

                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        canvas.toBlob((blob) => {
                            resolve(blob);
                        }, 'image/jpeg', quality);
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }
    </script>
</body>
</html>
