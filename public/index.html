<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>簡単家計簿</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f4f6f8; color: #333; padding-bottom: 40px; }
    header { background-color: #2b3a4a; color: #fff; text-align: center; padding: 15px; font-size: 1.2rem; font-weight: bold; }
    
    .nav-tabs { display: flex; background-color: #fff; border-bottom: 1px solid #ddd; }
    .tab-btn { flex: 1; padding: 12px; text-align: center; background: none; border: none; font-size: 0.95rem; font-weight: bold; color: #666; cursor: pointer; }
    .tab-btn.active { color: #007bff; border-bottom: 3px solid #007bff; }

    .container { max-width: 500px; margin: 20px auto; padding: 0 15px; }
    .card { background: #fff; border-radius: 10px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 20px; }
    .card h2 { font-size: 1.1rem; margin-bottom: 15px; color: #2b3a4a; }

    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 0.85rem; color: #666; margin-bottom: 5px; }
    .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; }
    
    .btn { width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; }
    .btn:disabled { background-color: #ccc; cursor: not-allowed; }

    .scanner-box { position: relative; background: #000; border-radius: 8px; overflow: hidden; text-align: center; color: #fff; min-height: 250px; }
    video { width: 100%; max-height: 280px; object-fit: cover; }
    canvas { display: none; }
    
    .ocr-status { margin-top: 12px; text-align: center; font-size: 0.9rem; font-weight: bold; color: #007bff; min-height: 24px; }

    .history-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #eee; }
    .history-item:last-child { border-bottom: none; }
    .item-info { font-size: 0.95rem; }
    .item-date { font-size: 0.75rem; color: #888; }
    .item-amount { font-size: 1.1rem; font-weight: bold; color: #e74c3c; }
    .del-btn { background: #ff4d4f; color: white; border: none; padding: 5px 10px; border-radius: 4px; font-size: 0.8rem; cursor: pointer; margin-left: 10px; }

    .total-box { font-size: 1.2rem; font-weight: bold; text-align: right; padding: 10px 0; border-top: 2px solid #333; margin-top: 10px; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
  </style>
</head>
<body>

  <header>簡単家計簿</header>

  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('input-tab')">✏️ 手動入力</button>
    <button class="tab-btn" onclick="switchTab('camera-tab')">📷 スキャン</button>
    <button class="tab-btn" onclick="switchTab('history-tab')">📋 支出履歴</button>
  </div>

  <div class="container">

    <!-- 1. 手動入力タブ -->
    <div id="input-tab" class="tab-content active">
      <div class="card">
        <h2>支出の直接登録</h2>
        <form id="expense-form">
          <div class="form-group">
            <label>日付</label>
            <input type="date" id="date" required>
          </div>
          <div class="form-group">
            <label>金額 (円)</label>
            <input type="number" id="amount" placeholder="1000" required>
          </div>
          <div class="form-group">
            <label>カテゴリ</label>
            <select id="category">
              <option value="食費">食費</option>
              <option value="日用品">日用品</option>
              <option value="交通費">交通費</option>
              <option value="娯楽">娯楽</option>
              <option value="その他">その他</option>
            </select>
          </div>
          <div class="form-group">
            <label>メモ</label>
            <input type="text" id="memo" placeholder="スーパーなど">
          </div>
          <button type="submit" class="btn">保存する</button>
        </form>
      </div>
    </div>

    <!-- 2. カメラタブ -->
    <div id="camera-tab" class="tab-content">
      <div class="card">
        <h2>✨ AI レシートスキャナー</h2>
        <div class="scanner-box">
          <video id="webcam" autoplay playsinline></video>
          <canvas id="snapshot-canvas"></canvas>
        </div>
        <button id="scan-btn" class="btn" style="margin-top: 15px;" onclick="captureAndGeminiOCR()">🤖 AIでレシートを解析</button>
        <div id="ocr-status" class="ocr-status">カメラにレシートをかざして「AIで解析」を押してください</div>
      </div>
    </div>

    <!-- 3. 履歴タブ -->
    <div id="history-tab" class="tab-content">
      <div class="card">
        <h2>支出履歴一覧</h2>
        <div id="history-list">読み込み中...</div>
        <div class="total-box">
          合計: <span id="total-amount">0</span> 円
        </div>
      </div>
    </div>

  </div>

  <script>
    document.getElementById('date').valueAsDate = new Date();

    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      if (event && event.target) event.target.classList.add('active');

      if (tabId === 'camera-tab') {
        startCamera();
        fetch('/api/expenses').catch(() => {});
      } else {
        stopCamera();
      }
      if (tabId === 'history-tab') {
        loadHistory();
      }
    }

    let videoStream = null;
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        videoStream = stream;
        document.getElementById('webcam').srcObject = stream;
      } catch (e) {
        console.error("Camera error:", e);
        document.getElementById('ocr-status').textContent = 'カメラの起動に失敗しました';
      }
    }

    function stopCamera() {
      if (videoStream) {
        videoStream.getTracks().forEach(track => track.stop());
        videoStream = null;
      }
    }

    // Gemini AI 高精度・高速スキャン（横幅600px / 品質0.5の最適設定）
    async function captureAndGeminiOCR() {
      const video = document.getElementById('webcam');
      const canvas = document.getElementById('snapshot-canvas');
      const statusEl = document.getElementById('ocr-status');
      const scanBtn = document.getElementById('scan-btn');

      if (!videoStream) return;

      const targetWidth = 600;
      const scale = targetWidth / (video.videoWidth || 640);
      const targetHeight = Math.round((video.videoHeight || 480) * scale);

      canvas.width = targetWidth;
      canvas.height = targetHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, targetWidth, targetHeight);

      scanBtn.disabled = true;
      statusEl.textContent = '⚡ 画像を送信して高速解析中...';

      canvas.toBlob(async (blob) => {
        if (!blob) {
          statusEl.textContent = '❌ 画像キャプチャ失敗';
          scanBtn.disabled = false;
          return;
        }

        console.log(`送信画像サイズ: ${(blob.size / 1024).toFixed(1)} KB`);

        const formData = new FormData();
        formData.append('file', blob, 'receipt.jpg');

        try {
          const res = await fetch('/api/scan-receipt', {
            method: 'POST',
            body: formData
          });

          if (!res.ok) {
            const errData = await res.json();
            throw new Error(errData.detail || 'AI解析失敗');
          }

          const result = await res.json();

          if (result.amount) {
            document.getElementById('amount').value = result.amount;
            if (result.date) document.getElementById('date').value = result.date;
            if (result.category) document.getElementById('category').value = result.category;
            if (result.memo) document.getElementById('memo').value = result.memo;

            statusEl.textContent = `✅ 解析完了！(¥${result.amount.toLocaleString()} / ${result.memo || ''})`;

            setTimeout(() => {
              switchTab('input-tab');
            }, 500);
          } else {
            statusEl.textContent = '⚠️ 金額が検出できませんでした';
          }
        } catch (err) {
          console.error(err);
          statusEl.textContent = '❌ 解析エラー';
        } finally {
          scanBtn.disabled = false;
        }
      }, 'image/jpeg', 0.5);
    }

    document.getElementById('expense-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = {
        date: document.getElementById('date').value,
        amount: parseFloat(document.getElementById('amount').value),
        category: document.getElementById('category').value,
        memo: document.getElementById('memo').value
      };

      const res = await fetch('/api/expenses', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });

      if (res.ok) {
        alert('保存しました！');
        document.getElementById('amount').value = '';
        document.getElementById('memo').value = '';
      } else {
        alert('エラーが発生しました');
      }
    });

    async function loadHistory() {
      const listEl = document.getElementById('history-list');
      const totalEl = document.getElementById('total-amount');
      listEl.innerHTML = '読み込み中...';

      const res = await fetch('/api/expenses');
      if (!res.ok) {
        listEl.innerHTML = 'データの取得に失敗しました';
        return;
      }

      const items = await res.json();
      if (items.length === 0) {
        listEl.innerHTML = '<p style="color:#888; text-align:center;">まだ登録されたデータがありません</p>';
        totalEl.textContent = '0';
        return;
      }

      let total = 0;
      listEl.innerHTML = '';

      items.forEach(item => {
        total += item.amount;
        const div = document.createElement('div');
        div.className = 'history-item';
        div.innerHTML = `
          <div>
            <div class="item-info"><strong>[${item.category}]</strong> ${item.memo || ''}</div>
            <div class="item-date">${item.date}</div>
          </div>
          <div style="display:flex; align-items:center;">
            <span class="item-amount">¥${item.amount.toLocaleString()}</span>
            <button class="del-btn" onclick="deleteItem(${item.id})">削除</button>
          </div>
        `;
        listEl.appendChild(div);
      });

      totalEl.textContent = total.toLocaleString();
    }

    async function deleteItem(id) {
      if (!confirm('本当に削除しますか？')) return;
      const res = await fetch(`/api/expenses/${id}`, { method: 'DELETE' });
      if (res.ok) {
        loadHistory();
      } else {
        alert('削除に失敗しました');
      }
    }
  </script>

</body>
</html>
